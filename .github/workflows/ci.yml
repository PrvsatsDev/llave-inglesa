# Comprobaciones en cada PR y en cada push a main: lo mismo que `npm run check` y `npm run e2e` en local.
# Las actions van fijadas a un commit (no a una etiqueta, que se puede mover) y sin credenciales en git.
name: Comprobaciones

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck y tests
        run: npm run check
      - name: Chromium para las pruebas en navegador
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Pruebas en navegador (build de producción)
        run: npm run e2e
      - name: Capturas si algo falla
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-resultados
          path: apps/web/e2e/.resultados
          retention-days: 7
